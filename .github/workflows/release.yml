name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  macos:
    name: Build macOS screensaver
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute version
        id: ver
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF#refs/tags/}"; v="${v#v}"
          else
            v="snap-$(date -u +%Y-%m-%d)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Build
        run: macos/build.sh

      - name: Package
        run: |
          ditto -c -k --keepParent macos/build/Starfield.saver \
            "Starfield-macos-${{ steps.ver.outputs.version }}.saver.zip"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Starfield-macos-${{ steps.ver.outputs.version }}.saver.zip
          path: Starfield-macos-${{ steps.ver.outputs.version }}.saver.zip

  windows:
    name: Build Windows screensavers (MinGW on Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Compute version
        id: ver
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            v="${GITHUB_REF#refs/tags/}"; v="${v#v}"
          else
            v="snap-$(date -u +%Y-%m-%d)"
          fi
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Install MinGW-w64
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-mingw-w64-x86-64 g++-mingw-w64-x86-64

      - name: Build Direct2D
        run: windows-direct2d/build.sh

      - name: Build GDI
        run: windows-gdi/build.sh

      - name: Rename
        run: |
          v="${{ steps.ver.outputs.version }}"
          mkdir out
          cp windows-direct2d/dist/Starfield.scr "out/Starfield-windows-direct2d-$v.scr"
          cp windows-gdi/dist/Starfield.scr "out/Starfield-windows-gdi-legacy-$v.scr"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-${{ steps.ver.outputs.version }}
          path: out/*

  release:
    name: Create Release
    needs: [macos, windows]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: artifacts

      - name: Package HTML version (self-hostable)
        run: |
          v="${GITHUB_REF#refs/tags/}"; v="${v#v}"
          mkdir -p site/starfield artifacts/html
          cp starfield.html site/starfield/
          cp starfield.html site/starfield/index.html
          cp manifest.webmanifest sw.js LICENSE site/starfield/
          cp -r icons site/starfield/icons
          (cd site && zip -qr "../artifacts/html/Starfield-html-$v.zip" starfield)

      - name: Write release notes
        run: |
          cat > notes.md <<'EOF'
          ## Changes

          - **feature**:
          - **improvement**: 
          - **bugfix**:
          - internal:

          ## Files

          |file|for|
          |-|-|
          | Starfield-macos-*.saver.zip | macOS 13+ (Apple Silicon and Intel). |
          | Starfield-windows-direct2d-*.scr | Windows 10 / 11 |
          | Starfield-windows-gdi-legacy-*.scr | Old Windows versions (Windows 7 / 8 / 8.1) |
          | Starfield-html-*.zip | Plain HTML version for self-hosting: unzip and serve the `starfield/` folder over HTTPS (installable as a PWA) |

          ## Installing

          > [!NOTE]
          > I have no paid Apple Developer ID or Windows code-signing certificate, so macOS and Windows **will warn about the downloads**. More details in the [README](https://github.com/waschmittel/starfield#unsigned-files-macos-and-windows).

          |file|installation|
          |-|-|
          |macOS| unzip and double-click `Starfield.saver`. If it is blocked, open **System Settings > Privacy & Security** and click **Open Anyway**, or run `xattr -dr com.apple.quarantine Starfield.saver`. Then pick **Starfield** in **System Settings > Screen Saver**|
          |Windows| right-click the `.scr` > **Properties** > tick **Unblock** > OK, then right-click > **Install**. If SmartScreen shows "Windows protected your PC", click **More info > Run anyway**. Your browser may ask you to **Keep** the file first.|
          |HTML|unzip and serve the `starfield/` folder over HTTPS (installable as a PWA), or just open the file locally (no PWA support)|


          **Full Changelog**: https://github.com/waschmittel/starfield/compare/v1.0.0...v1.1.0
          EOF

      - name: Create release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: artifacts/**/*
          body_path: notes.md
          generate_release_notes: true
